<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT | Ceylon Travels</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #000; color: #fff; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 35px 8%; }
        .logo { font-size: 22px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .nav-links { list-style: none; }
        .nav-links li { display: inline-block; margin: 0 25px; }
        .nav-links a { text-decoration: none; color: #fff; font-size: 14px; text-transform: uppercase; opacity: 0.7; }
        
        .contact-container { padding: 40px 8% 100px 8%; max-width: 700px; margin: 0 auto; }
        .page-title { text-align: center; margin-bottom: 60px; }
        .page-title h1 { font-size: 42px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
        
        /* Ultra Minimal Form */
        .contact-form { display: flex; flex-direction: column; gap: 40px; }
        .form-group { display: flex; flex-direction: column; position: relative; }
        .form-group input, .form-group textarea {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 15px 0;
            color: #fff;
            font-size: 16px;
            font-weight: 300;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-bottom: 1px solid #fff;
        }
        .form-group label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.5;
        }
        
        .submit-btn {
            background: #fff;
            color: #000;
            border: 1px solid #fff;
            padding: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background: transparent;
            color: #fff;
        }

        footer { display: flex; justify-content: space-between; align-items: center; padding: 35px 8%; border-top: 1px solid rgba(255, 255, 255, 0.1); margin-top: 80px;}
        .copyright { font-size: 12px; opacity: 0.5; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Ceylon / Travels</div>
      <ul class="nav-links">
    <li><a href="./">Home</a></li>
    <li><a href="explore">Explore</a></li>
    <li><a href="journeys">Journeys</a></li>
    <li><a href="journal">Journal</a></li>
    <li><a href="contact" style="opacity: 1; font-weight: 600;">Contact</a></li>
</ul>
    </header>

    <main class="contact-container">
        <div class="page-title">
            <h1>Start Your Journey</h1>
        </div>

        <form class="contact-form" action="#" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" required placeholder="e.g. Alexander Wright">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" required placeholder="e.g. alex@example.com">
            </div>
            <div class="form-group">
                <label>Tell us about your travel plans</label>
                <textarea rows="4" required placeholder="Desired dates, destinations, or preferences..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Submit Inquiry</button>
        </form>
    </main>

    <footer>
        <p class="copyright">&copy; 2026 CEYLON TRAVELS. UNCOMPROMISED LUXURY.</p>
    </footer>

</body>
</html>
