<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT | Ceylon Travels</title>
    
    <!-- Google Fonts for Clean Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="responsive.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #000; color: #fff; overflow-x: hidden; min-height: 100vh; position: relative; }
        
        /* Smooth Background Image Slider */
        .bg-slider {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* පින්තූර මාරුවෙන Smooth ගතිය */
        }

        .slide.active {
            opacity: 1;
        }

        /* High Contrast Dark Overlay (ෆෝම් එකේ අකුරු ලස්සනට පේන්න) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7); /* 70% කළු පැහැති තිරයක් */
            z-index: -1;
        }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 35px 8%; z-index: 10; position: relative; }
        .logo { font-size: 22px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .nav-links { list-style: none; }
        .nav-links li { display: inline-block; margin: 0 25px; }
        
        .nav-links a { 
            text-decoration: none; 
            color: #fff; 
            font-size: 14px; 
            text-transform: uppercase; 
            opacity: 0.7; 
            transition: opacity 0.3s ease; 
        }
        .nav-links a:hover { opacity: 1; }

        /* Icon styling */
        .nav-links a i {
            margin-right: 6px;
            font-size: 13px;
            vertical-align: middle;
        }
        
        .contact-container { padding: 40px 8% 100px 8%; max-width: 700px; margin: 0 auto; position: relative; z-index: 5; }
        .page-title { text-align: center; margin-bottom: 60px; }
        .page-title h1 { font-size: 42px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
        
        /* Ultra Minimal Form */
        .contact-form { display: flex; flex-direction: column; gap: 40px; }
        .form-group { display: flex; flex-direction: column; position: relative; }
        .form-group input, .form-group textarea {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 15px 0;
            color: #fff;
            font-size: 16px;
            font-weight: 300;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-bottom: 1px solid #fff;
        }
        .form-group label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.5;
        }
        
        .submit-btn {
            background: #fff;
            color: #000;
            border: 1px solid #fff;
            padding: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background: transparent;
            color: #fff;
        }

        footer { display: flex; justify-content: space-between; align-items: center; padding: 35px 8%; border-top: 1px solid rgba(255, 255, 255, 0.1); margin-top: 80px; position: relative; z-index: 5; }
        .copyright { font-size: 12px; opacity: 0.5; }

        /* Mobile Optimization Fix (Phone එකට සියල්ල සකස් කිරීම) */
        @media (max-width: 768px) {
            header {
                flex-direction: column !important;
                gap: 15px !important;
                padding: 20px 5% !important;
            }

            .nav-links { 
                display: flex !important; 
                visibility: visible !important;
                opacity: 1 !important;
                flex-wrap: wrap !important;
                justify-content: center !important;
                gap: 12px !important;
                width: 100% !important;
                padding: 0 !important;
            }
            
            .nav-links li { 
                display: inline-block !important; 
                margin: 0 !important; 
            }

            .nav-links a {
                font-size: 11px !important;
                letter-spacing: 1px !important;
                color: #ffffff !important;
            }

            .contact-container {
                padding: 20px 5% 60px 5% !important;
                width: 100% !important;
            }

            .page-title h1 {
                font-size: 28px !important;
                letter-spacing: 1px !important;
            }

            .contact-form {
                gap: 25px !important;
            }

            footer { 
                flex-direction: column !important; 
                gap: 15px !important; 
                text-align: center !important; 
                margin-top: 40px !important;
                padding: 25px 5% !important;
            }
        }
    </style>
</head>
<body>

    <!-- Background Slider Images (ලංකාවේ Luxury ෆොටෝස් 3ක්) -->
    <div class="bg-slider">
        <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1546708973-b339540b5162?q=80&w=1920');"></div> <!-- Sigiriya View -->
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1563182117-2174f8cfb705?q=80&w=1920');"></div> <!-- Ella Train -->
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1586861635167-e5223aadc9fe?q=80&w=1920');"></div> <!-- Mirissa Beach -->
    </div>
    
    <div class="overlay"></div>

    <header>
        <div class="logo">Ceylon / Travels</div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-regular fa-compass"></i>Home</a></li>
            <li><a href="explore.html"><i class="fa-solid fa-earth-asia"></i>Explore</a></li>
            <li><a href="journeys.html"><i class="fa-solid fa-route"></i>Journeys</a></li>
            <li><a href="journal.html"><i class="fa-regular fa-newspaper"></i>Journal</a></li>
            <li><a href="contact.html" style="opacity: 1; font-weight: 600;"><i class="fa-regular fa-envelope"></i>Contact</a></li>
        </ul>
    </header>

    <main class="contact-container">
        <div class="page-title">
            <h1>Start Your Journey</h1>
        </div>

        <form class="contact-form" action="#" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" required placeholder="e.g. Alexander Wright">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" required placeholder="e.g. alex@example.com">
            </div>
            <div class="form-group">
                <label>Tell us about your travel plans</label>
                <textarea rows="4" required placeholder="Desired dates, destinations, or preferences..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Submit Inquiry</button>
        </form>
    </main>

    <footer>
        <p class="copyright">&copy; 2026 CEYLON TRAVELS. UNCOMPROMISED LUXURY.</p>
    </footer>

    <!-- Background එක Auto Change වෙන්න අවශ්‍ය පුංචි Script එක -->
    <script>
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        // තත්පර 5න් පහට (5000ms) පින්තූරය මාරු වේ
        setInterval(nextSlide, 5000);
    </script>

</body>
</html>
